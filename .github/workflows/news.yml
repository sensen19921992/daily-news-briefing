name: Daily News Briefing

on:
  schedule:
    - cron: '0 6 * * *'   # 08:00 dansk sommertid (CEST)
    - cron: '0 18 * * *'  # 20:00 dansk sommertid (CEST)
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Send news briefing
        run: python news_breifing.py
